<a routerLink="/" class="volver">← Volver al campo</a>

<div class="tarjeta">
  <h2>Plantilla 2026/27</h2>

  <div class="filtros">
    <input
      type="text"
      placeholder="Buscar jugador..."
      (input)="buscar($event)"
    >

    <select (change)="elegirPosicion($event)">
      <option value="">Todas las posiciones</option>
      <option value="Portero">Portero</option>
      <option value="Defensa">Defensa</option>
      <option value="Centrocampista">Centrocampista</option>
      <option value="Delantero">Delantero</option>
    </select>

    <select (change)="elegirOrden($event)">
      <option value="dorsal">Ordenar por dorsal</option>
      <option value="nombre">Ordenar por nombre</option>
      <option value="edad">Ordenar por edad (más joven)</option>
    </select>
  </div>

  <table>
    <tr>
      <th>Dorsal</th>
      <th>Nombre</th>
      <th>Posición</th>
      <th>Nacionalidad</th>
    </tr>
    @for (j of filtrados(); track j.idJugador) {
      <tr>
        <td>{{ j.dorsal }}</td>
        <td>
          <a [routerLink]="['/jugador', j.idJugador]">{{ j.nombre }}</a>
          @if (j.titular) {
            <span class="etiqueta-titular">Titular</span>
          }
        </td>
        <td>{{ j.posicion }}</td>
        <td>{{ j.nacionalidad }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No se ha encontrado ningún jugador.</td>
      </tr>
    }
  </table>
</div>
